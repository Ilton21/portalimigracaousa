name: Auditoria de segurança e build
on:
  push:
    branches:
      - security-admin-hardening-2026-11
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Auditar dependências usadas em produção
        run: npm audit --omit=dev --audit-level=high
      - name: Compilar o portal
        run: npm run build
